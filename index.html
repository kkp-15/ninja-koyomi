:root{
  --bg:#fbf6ea; --paper:#fffdf7; --ink:#3a2e22; --sub:#8a6f4a; --line:#eadcc0;
  --accent:#e8742c; --night:#2f2a3a;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:6px;padding-block:10px 2px}
h1{font-size:17px;margin:0 auto 0 0;letter-spacing:.06em}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:44px;min-width:44px;padding:0 10px;cursor:pointer}
.btn:focus-visible,.cell:focus-visible,.peek:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#ym{font-family:var(--f-num);font-size:24px;min-width:96px;text-align:center;line-height:1.05}
#ym small{font-family:var(--f-body);font-size:12px;color:var(--sub);display:block}

/* らせん */
#board{position:relative;margin:4px auto 0;width:100%;max-width:460px;aspect-ratio:1/1.26;border-radius:28px;
  background:radial-gradient(70% 70% at 50% 50%,#fffaf0 0%,#f7eedb 62%,#efe2c7 100%)}
#spiral{position:absolute;inset:0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#spiral .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--sub);pointer-events:none}
#cats{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 11px;min-height:34px;display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.35}
#cal{position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-50%);z-index:2;perspective:620px;perspective-origin:50% 12%}
#stack{position:relative;transform-style:preserve-3d;transform:rotateX(var(--tilt,45deg))}
.sheet{transform:translateZ(calc(var(--k,0) * var(--gap,68px)))}
/* 紙：見ている年は紙、前後の年はガラスのように透ける。同じ日は同じ位置（1〜7日が1段目） */
.sheet{position:relative;background:color-mix(in srgb,var(--paper) 70%,transparent);border:1px solid var(--line);border-radius:14px;padding:6px 4px 5px;
  box-shadow:0 18px 30px -16px rgba(58,46,34,.55), 0 1px 0 rgba(255,255,255,.6) inset;transform-style:preserve-3d}
.sheet.ghost{position:absolute;inset:0;pointer-events:none;background:color-mix(in srgb,var(--paper) 38%,transparent);box-shadow:none;border-color:color-mix(in srgb,var(--sub) 45%,transparent)}
.sheet.ghost .n{color:var(--sub);opacity:.32}
.sheet.ghost .w{visibility:hidden}
.sheet.ghost .cell.sel .n{opacity:1}
.sheet.ghost .cell.sel .w{visibility:visible;font-weight:700;color:var(--ink)}
.sheet.ghost .cell.sel{background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.sheet.ghost .cell.sel .n{color:var(--ink);font-weight:700}

.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.su{color:#c9475f!important}.sa{color:#4473c4!important}

.cell .n{font-family:var(--f-num);font-size:15px;line-height:1;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cell .w{font-size:8px;line-height:1;color:var(--sub)}
.cell .mark{position:absolute;inset:3px;border-radius:7px;pointer-events:none}
.cell.sel{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;background:linear-gradient(transparent,var(--bg) 35%);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bottom .main{flex:1}
dialog{border:none;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(58,46,34,.35)}
form{padding:16px;display:flex;flex-direction:column;gap:12px}
form h2{font-size:17px;margin:0}

input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;min-height:44px;font-size:16px}
textarea{min-height:60px;resize:vertical}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px;min-height:44px}
.check input{width:22px;height:22px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .main{flex:1}
.small{font-size:12px;color:var(--sub);line-height:1.6;margin:0}
</style>

<script>
const CATS = {bday:'誕生日', memorial:'命日・法事', anniv:'記念日', work:'仕事', kagura:'神楽', family:'家族', money:'お金・手続き', other:'その他'};
const HEX = {bday:'#d9a62e', memorial:'#6b5a8e', anniv:'#c77f95', work:'#e8742c', kagura:'#c9475f', family:'#3b8f6b', money:'#4473c4', other:'#8f8063'};
// 毎年くり返す「ふしめ」の名前（長寿祝いは数え年、結婚記念日は満年数）
const CHOJU = {61:'還暦',70:'古希',77:'喜寿',80:'傘寿',88:'米寿',90:'卒寿',99:'白寿',100:'百寿'};
const KON = {1:'紙婚式',2:'綿婚式',3:'革婚式',4:'花婚式',5:'木婚式',6:'鉄婚式',7:'銅婚式',8:'ゴム婚式',9:'陶器婚式',10:'錫婚式',15:'水晶婚式',20:'磁器婚式',25:'銀婚式',30:'真珠婚式',35:'珊瑚婚式',40:'ルビー婚式',45:'サファイア婚式',50:'金婚式',55:'エメラルド婚式',60:'ダイヤモンド婚式'};
const CHUIN = [['初七日',7],['四十九日',49],['百か日',100]];
const NENKI = {1:'一周忌',2:'三回忌',6:'七回忌',12:'十三回忌',16:'十七回忌',22:'二十三回忌',26:'二十七回忌',32:'三十三回忌',49:'五十回忌'};
const SKEY = 'kasane-settings-v1';
let settings = {};
try { settings = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch(e) { settings = {}; }
function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(settings)); }catch(e){} }
// その日に何歳か（誕生日が入っているとき）
function ageAt(birth, y, m, d){ if(!birth) return null; const [by,bm,bd]=birth.split('-').map(Number); let a=y-by; if (m<bm || (m===bm && d<bd)) a--; return a; }
function ageLabel(y){ const a=ageAt(settings.birthday, y, M, Math.min(D,dim(y,M))); return a===null||a<0 ? '' : `・${a}歳`; }
const WD = ['日','月','火','水','木','金','土'];
const KEY = 'rasen-koyomi-v1';
const T = new Date(), TY = T.getFullYear(), TM = T.getMonth()+1, TD = T.getDate();
const pad = n=>String(n).padStart(2,'0');
const dim = (y,m)=>new Date(y,m,0).getDate();
const esc = s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let events = [];
try { events = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { events = []; }
// はじめて開いたときだけ、見方が分かる見本を入れる（「見本」と付けてあるので消してかまわない）
if (!events.length) events = [
  {id:'s1', title:'（見本）母', date:`${TY-59}-${pad(TM)}-${pad(Math.min(TD+3,28))}`, cat:'bday', yearly:true, memo:''},
  {id:'s2', title:'（見本）祖父', date:`${TY-2}-${pad(TM)}-${pad(Math.max(TD-4,1))}`, cat:'memorial', yearly:true, memo:''},
  {id:'s3', title:'（見本）結婚記念日', date:`${TY-10}-${pad(TM===12?11:TM+1)}-10`, cat:'anniv', yearly:true, memo:''},
  {id:'s4', title:'（見本）確定申告のしめきり', date:`${TY}-03-15`, cat:'money', yearly:true, memo:''},
];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(events)); }catch(e){ note('保存できませんでした。ブラウザの設定を確認してください。'); } }
function note(t){ const n=document.getElementById('note'); n.textContent=t; n.hidden=false; }

let Y = TY, M = TM, D = TD;
const on = Object.fromEntries(Object.keys(CATS).map(k=>[k,true]));

// その年月日に出る予定（毎年くり返すものは登録した年から先に出す）
// その年に出るもの。誕生日・命日・記念日からは、年齢や回忌などの「ふしめ」を自動で作る
const occCache = new Map();
function occ(y){
  if (occCache.has(y)) return occCache.get(y);
  const out=[];
  const at=(m,d)=> (m===2 && d===29 && dim(y,2)===28) ? 28 : d;
  for (const e of events){
    if (!on[e.cat]) continue;
    const [ey,em,ed]=e.date.split('-').map(Number), t=e.title;
    if (e.cat==='bday'){
      if (y<ey) continue; const age=y-ey, kz=age+1;
      out.push({m:em,d:at(em,ed),e,label:`${t}の誕生日（${age}歳）${CHOJU[kz]?`・${CHOJU[kz]}の年`:''}`,big:!!CHOJU[kz]});
    } else if (e.cat==='memorial'){
      for (const [n,day] of CHUIN){ const x=new Date(ey,em-1,ed+day-1); if (x.getFullYear()===y) out.push({m:x.getMonth()+1,d:x.getDate(),e,label:`${t}の${n}`,big:true}); }
      const k=y-ey;
      if (k>=1) out.push({m:em,d:at(em,ed),e,label: NENKI[k] ? `${t}の${NENKI[k]}` : `${t}の祥月命日`, big:!!NENKI[k]});
      else if (k===0) out.push({m:em,d:ed,e,label:`${t}の命日`});
    } else if (e.cat==='anniv'){
      if (y<ey) continue; const n=y-ey;
      out.push({m:em,d:at(em,ed),e,label: n===0 ? t : `${t} ${n}周年${KON[n]?`（${KON[n]}）`:''}`, big:!!KON[n]&&n%5===0});
    } else if (e.yearly ? y>=ey : y===ey){
      out.push({m:em,d:at(em,ed),e,label:t});
    }
  }
  occCache.set(y,out); return out;
}
function eventsOn(y,m,d){ return occ(y).filter(o=>o.m===m&&o.d===d); }

/* ---------- らせん ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const R = 1, H = 0.46, SPAN = 2;          // 見ている年の前後2年まで描く
let yaw = 0, yawTarget = 0, pitch = 0.78, hits = [], dayHits = [];
const yearLen = y=>(Date.UTC(y+1,0,1)-Date.UTC(y,0,1))/864e5;
const frac = (y,m,d)=>(Date.UTC(y,m-1,d)-Date.UTC(y,0,1))/864e5/yearLen(y);
const ang = f=>-f*Math.PI*2 - Math.PI/2;
const fracOfFront = ()=>{ let f=((-(Math.PI/2-yaw)-Math.PI/2)/(Math.PI*2))%1; return f<0?f+1:f; };
function P(y,f,r=R){ const a=ang(f); return {x:r*Math.cos(a), z:r*Math.sin(a), y:(y-Y+f-0.5)*H}; }
function proj(p,W,Hh){
  let x=p.x, y=p.y, z=p.z;
  const c=Math.cos(yaw), s=Math.sin(yaw); [x,z]=[x*c-z*s, x*s+z*c];
  const cp=Math.cos(pitch), sp=Math.sin(pitch); [y,z]=[y*cp-z*sp, y*sp+z*cp];
  const sc=Math.min(W,Hh)*0.43, k=4.2/(4.2-z);
  return {sx:W/2+x*sc*k, sy:Hh*0.49-y*sc*k, k, z};
}
const alphaOf = y=>{ const d=Math.abs(y-Y); return d===0?1:d===1?.34:.12; };
// 選んだ月が手前に来る向き
function aimYaw(){ const a = ang(frac(Y,M,Math.min(D,dim(Y,M)))); yawTarget = Math.PI/2 - a; }

function drawSpiral(){
  const dpr=devicePixelRatio||1, W=cv.clientWidth, Hh=cv.clientHeight, sc=Math.min(W,Hh)*0.43;
  if (cv.width!==W*dpr || cv.height!==Hh*dpr){ cv.width=W*dpr; cv.height=Hh*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,Hh);
  ctx.textAlign='center'; ctx.lineCap='round';
  const segs=[];
  for (let y=Y-SPAN; y<=Y+SPAN; y++){
    for (let j=0;j<240;j++){
      const f0=j/240, f1=(j+1)/240, a=proj(P(y,f0),W,Hh), b=proj(P(y,f1),W,Hh);
      segs.push({a,b,y,z:(a.z+b.z)/2});
    }
  }
  // 奥から描くと、手前の線が上に重なって立体に見える
  segs.sort((p,q)=>p.z-q.z);
  for (const s of segs){
    const al = alphaOf(s.y)*(0.45+0.55*Math.min(1,(s.a.k-0.8)/0.4));
    ctx.beginPath(); ctx.moveTo(s.a.sx,s.a.sy); ctx.lineTo(s.b.sx,s.b.sy);
    ctx.strokeStyle=`rgba(138,111,74,${al})`; ctx.lineWidth=(s.y===Y?2.6:1.5)*(0.7+0.5*Math.min(1,(s.a.k-0.8)/0.4)); ctx.stroke();
  }
  // 見ている月の弧をオレンジで太く
  ctx.beginPath();
  for (let d=1; d<=dim(Y,M); d++){ const q=proj(P(Y,frac(Y,M,d)),W,Hh); d===1?ctx.moveTo(q.sx,q.sy):ctx.lineTo(q.sx,q.sy); }
  { const q=proj(P(Y,frac(Y,M,dim(Y,M))+1/yearLen(Y)),W,Hh); ctx.lineTo(q.sx,q.sy); }
  ctx.strokeStyle='rgba(232,116,44,.85)'; ctx.lineWidth=5; ctx.stroke();
  { const c=proj({x:0,y:-H*1.05,z:0},W,Hh); const g=ctx.createRadialGradient(c.sx,c.sy,0,c.sx,c.sy,sc*1.05);
    g.addColorStop(0,'rgba(58,46,34,.16)'); g.addColorStop(1,'rgba(58,46,34,0)');
    ctx.save(); ctx.translate(c.sx,c.sy); ctx.scale(1,Math.max(.15,Math.sin(pitch))); ctx.translate(-c.sx,-c.sy);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.sx,c.sy,sc*1.05,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  // 月の名前（見ている年の外側）
  for (let m=1;m<=12;m++){
    const q=proj(P(Y,frac(Y,m,1)+0.04,R*1.17),W,Hh);
    ctx.font=(m===M?'700 13px':'500 11px')+' "Zen Maru Gothic"';
    ctx.fillStyle = m===M ? '#e8742c' : `rgba(58,46,34,${0.3+0.45*Math.min(1,(q.k-0.8)/0.4)})`;
    ctx.fillText(m+'月', q.sx, q.sy+4);
  }
  // 年の名前
  { const u=proj({x:0,y:H,z:-R*0.72},W,Hh), d=proj({x:0,y:-H,z:R*0.72},W,Hh);
    ctx.font='500 11px "Zen Maru Gothic"'; ctx.fillStyle='rgba(138,111,74,.6)';
    ctx.fillText((Y+1)+'年', u.sx, u.sy+4); ctx.fillText((Y-1)+'年', d.sx, d.sy+4); }
  // 予定の点
  hits=[];
  const pts=[];
  for (let y=Y-SPAN;y<=Y+SPAN;y++) for (const o of occ(y)){ const q=proj(P(y,frac(y,o.m,o.d)),W,Hh); pts.push({q,y,m:o.m,d:o.d,e:o.e,big:o.big}); }
  pts.sort((a,b)=>a.q.z-b.q.z);
  for (const p of pts){
    ctx.globalAlpha=alphaOf(p.y);
    ctx.beginPath(); ctx.arc(p.q.sx,p.q.sy,(p.big?6.5:4.5)*p.q.k,0,Math.PI*2); ctx.fillStyle=HEX[p.e.cat]; ctx.fill();
    ctx.globalAlpha=1;
    if (Math.abs(p.y-Y)<=1) hits.push({x:p.q.sx,y:p.q.sy,r:16,y0:p.y,m:p.m,d:p.d});
  }
  // 今日と選んだ日
  if (Math.abs(TY-Y)<=SPAN){ const q=proj(P(TY,frac(TY,TM,TD)),W,Hh); ctx.globalAlpha=alphaOf(TY); ctx.beginPath(); ctx.arc(q.sx,q.sy,7*q.k,0,Math.PI*2); ctx.strokeStyle='#3a2e22'; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1; }
  { const q=proj(P(Y,frac(Y,M,D)),W,Hh);
    const g=ctx.createRadialGradient(q.sx,q.sy,0,q.sx,q.sy,16*q.k); g.addColorStop(0,'rgba(232,116,44,.45)'); g.addColorStop(1,'rgba(232,116,44,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.sx,q.sy,16*q.k,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(q.sx,q.sy,5*q.k,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#e8742c'; ctx.lineWidth=2.5; ctx.stroke();
    // 前年・来年の同じ日を細い線でつなぐ
    const a=proj(P(Y-1,frac(Y-1,M,Math.min(D,dim(Y-1,M)))),W,Hh), b=proj(P(Y+1,frac(Y+1,M,Math.min(D,dim(Y+1,M)))),W,Hh);
    ctx.setLineDash([2,4]); ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.strokeStyle='rgba(232,116,44,.55)'; ctx.lineWidth=1.3; ctx.stroke(); ctx.setLineDash([]);
  }
  // 押して選べる日（見ている年と前後1年）
  dayHits=[];
  for (let y=Y-1;y<=Y+1;y++) for (let n=0;n<yearLen(y);n+=1){
    const dt=new Date(Date.UTC(y,0,1+n)); const q=proj(P(y,n/yearLen(y)),W,Hh);
    dayHits.push({x:q.sx,y:q.sy,y0:y,m:dt.getUTCMonth()+1,d:dt.getUTCDate(),z:q.z});
  }
}
// 回り込みのアニメーション
let raf=null;
function animate(){
  const diff = ((yawTarget-yaw+Math.PI*3)%(Math.PI*2))-Math.PI;
  if (Math.abs(diff)<0.002 || matchMedia('(prefers-reduced-motion: reduce)').matches){ yaw=yawTarget; drawSpiral(); raf=null; return; }
  yaw += diff*0.18; drawSpiral(); raf=requestAnimationFrame(animate);
}
function spin(){ aimYaw(); if(!raf) raf=requestAnimationFrame(animate); }

// らせんの操作：横に回す・縦に傾ける・押して選ぶ
let drag=null, moved=false;
cv.addEventListener('pointerdown',e=>{ try{ cv.setPointerCapture(e.pointerId); }catch(_){} drag={x:e.clientX,y:e.clientY,yaw,pitch}; moved=false; });
cv.addEventListener('pointermove',e=>{
  if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if (Math.abs(dx)+Math.abs(dy)>6) moved=true; if(!moved) return;
  yaw=yawTarget=drag.yaw-dx*0.012; pitch=Math.min(1.25,Math.max(0.35,drag.pitch+dy*0.005));
  const st=document.getElementById('stack'); if(st){ st.style.setProperty('--tilt',tiltDeg()+'deg'); st.style.setProperty('--gap',GAP()+'px'); }
  drawSpiral();
});
cv.addEventListener('pointerup',e=>{
  if (drag && !moved){
    const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    let best=null, bd=1e9;
    for (const h of hits){ const d=Math.hypot(h.x-x,h.y-y); if(d<h.r&&d<bd){bd=d;best=h;} }
    if (!best){ for (const h of dayHits){ const d=Math.hypot(h.x-x,h.y-y)-h.z*4; if(d<bd){bd=d;best=h;} } if (bd>26) best=null; }
    if (best){ Y=best.y0; M=best.m; D=best.d; render(); }
  } else if (drag && moved){
    const f=fracOfFront(), dt=new Date(Date.UTC(Y,0,1)+f*yearLen(Y)*864e5);
    M=dt.getUTCMonth()+1; render();
  }
  drag=null;
});
cv.addEventListener('pointercancel',()=>drag=null);

/* ---------- 月カレンダー ---------- */
const cal = document.getElementById('cal');
const GAP = ()=>H*Math.min(cv.clientWidth,cv.clientHeight)*0.43; // 年と年の高さ（らせんの輪の間隔に合わせる）
const tiltDeg = ()=>90-pitch*180/Math.PI;
function sheetHTML(y,k){
  const n=dim(y,M); let cells='';
  for (let d=1; d<=35; d++){
    if (d>n){ cells+='<div class="cell out"></div>'; continue; }
    const w=new Date(y,M-1,d).getDay(), evs=eventsOn(y,M,d);
    const mark = evs.length ? `<span class="mark" style="background:${HEX[evs[0].e.cat]};opacity:${k===0?.16:.5}"></span>` : '';
    const dots = k===0 ? `<span class="dots">${evs.slice(0,3).map(o=>`<i style="background:${HEX[o.e.cat]}"></i>`).join('')}</span>` : '';
    const sel = (d===D)?' sel':'', tod=(y===TY&&M===TM&&d===TD)?' tod':'';
    cells += k===0
      ? `<button type="button" class="cell${sel}${tod}" data-d="${d}" aria-label="${M}月${d}日（${WD[w]}）${evs.length?'・予定'+evs.length+'件':''}">${mark}<span class="n ${w===0?'su':w===6?'sa':''}">${d}</span><span class="w">${WD[w]}</span>${dots}</button>`
      : `<div class="cell${sel}${tod}">${mark}<span class="n ${w===0?'su':w===6?'sa':''}">${d}</span><span class="w">${WD[w]}</span></div>`;
  }
  const op = k===0?1:.78;
  return `<div class="sheet${k?' ghost':''}" style="--k:${k};opacity:${op}"><span class="yl">${y}年${ageLabel(y)}</span><div class="wk">${cells}</div></div>`;
}
function renderCal(){
  cal.innerHTML = `<div id="stack">${sheetHTML(Y-1,-1)}${sheetHTML(Y,0)}${sheetHTML(Y+1,1)}</div>`;
  const stack=document.getElementById('stack'); const G=GAP();
  stack.style.setProperty('--gap',G+'px'); stack.style.setProperty('--tilt',tiltDeg()+'deg');
  const cur=stack.querySelector('.sheet:not(.ghost) .cell.sel');
  if (cur){
    const p=document.createElement('div'); p.id='pillar';
    p.style.left=(cur.offsetLeft+cur.offsetWidth/2)+'px';
    p.style.top=(cur.offsetTop+cur.offsetHeight/2-G)+'px';
    p.style.height=(G*2)+'px';
    p.style.transform=`translateZ(${-G}px) rotateX(90deg)`;
    stack.querySelector('.sheet:not(.ghost)').appendChild(p);
  }
  cal.querySelectorAll('.cell[data-d]').forEach(c=>c.onclick=()=>{ D=+c.dataset.d; render(); });
}
let sx=null;
cal.addEventListener('pointerdown',e=>{sx=e.clientX;});
cal.addEventListener('pointerup',e=>{ if(sx!==null&&Math.abs(e.clientX-sx)>50) moveMonth(e.clientX<sx?1:-1); sx=null; });

/* ---------- 選んだ日の3年分 ---------- */
function renderDetail(){
  document.getElementById('dTitle').textContent=`${M}月${D}日`;
  document.getElementById('rows').innerHTML=[Y+1,Y,Y-1].map(y=>{
    const dd=Math.min(D,dim(y,M)), evs=eventsOn(y,M,dd), wd=WD[new Date(y,M-1,dd).getDay()];
    const list=evs.length?evs.map(o=>`<div class="ev" data-id="${o.e.id}" role="button" tabindex="0"><i style="background:${HEX[o.e.cat]}"></i><span>${esc(o.label)}</span>${o.e.yearly&&!['bday','memorial','anniv'].includes(o.e.cat)?'<em>毎年</em>':''}</div>`).join(''):'<div class="empty">予定なし</div>';
    const ag=ageAt(settings.birthday,y,M,dd); const agt = ag===null||ag<0 ? '' : `<br>${ag}歳`;
    return `<div class="yr ${y===Y?'cur':'other'}"><div class="y">${y}年<br>（${wd}）${agt}</div><div>${list}</div></div>`;
  }).join('');
  document.querySelectorAll('#rows .ev').forEach(el=>el.onclick=()=>openForm(events.find(e=>e.id===el.dataset.id)));
}

function render(){
  occCache.clear();
  D=Math.min(D,dim(Y,M));
  document.getElementById('ym').innerHTML=`${M}月<small>${Y}年</small>`;
  renderCal(); renderDetail(); spin(); drawSpiral();
}
function moveMonth(n){ M+=n; if(M<1){M=12;Y--;} if(M>12){M=1;Y++;} render(); }
document.getElementById('prevM').onclick=()=>moveMonth(-1);
document.getElementById('nextM').onclick=()=>moveMonth(1);
document.getElementById('yPrev').onclick=()=>{ Y--; render(); };
document.getElementById('yNext').onclick=()=>{ Y++; render(); };
const TILTS=[1.15,0.78,0.5]; let ti=1;
document.getElementById('tiltB').onclick=()=>{ ti=(ti+1)%TILTS.length; pitch=TILTS[ti]; render(); };
document.getElementById('todayB').onclick=()=>{ Y=TY; M=TM; D=TD; render(); };

const catsEl=document.getElementById('cats');
for (const [k,name] of Object.entries(CATS)){
  const b=document.createElement('button'); b.className='chip'; b.type='button';
  b.innerHTML=`<i style="background:${HEX[k]}"></i>${name}`;
  b.onclick=()=>{ on[k]=!on[k]; b.classList.toggle('off',!on[k]); render(); };
  catsEl.appendChild(b);
}

/* ---------- 追加・編集 ---------- */
const dlg=document.getElementById('dlg'), fC=document.getElementById('fC'), fDel=document.getElementById('fDel');
fC.innerHTML=Object.entries(CATS).map(([k,n])=>`<option value="${k}">${n}</option>`).join('');
const FORM = {bday:['だれの（名前）','生まれた日（年も）','例: 母'], memorial:['だれの（名前）','亡くなった日（年も）','例: 祖父'], anniv:['なんの記念日','その日（年も）','例: 結婚記念日']};
fC.onchange=()=>{ const f=FORM[fC.value]||['なにを','いつ','例: 確定申告のしめきり']; document.getElementById('lT').firstChild.textContent=f[0]; document.getElementById('lD').firstChild.textContent=f[1]; document.getElementById('fT').placeholder=f[2]; document.getElementById('fY').closest('label').hidden=!!FORM[fC.value]; };
let editing=null;
function openForm(e){
  editing=e||null;
  document.getElementById('fmTitle').textContent=e?'予定を直す':'予定を追加';
  document.getElementById('fT').value=e?e.title:'';
  document.getElementById('fD').value=e?e.date:`${Y}-${pad(M)}-${pad(D)}`;
  fC.value=e?e.cat:'work'; fC.onchange();
  document.getElementById('fY').checked=e?!!e.yearly:false;
  document.getElementById('fM').value=e?(e.memo||''):'';
  fDel.hidden=!e; fDel.dataset.armed=''; fDel.textContent='消す';
  dlg.showModal();
}
document.getElementById('addB').onclick=()=>openForm(null);
document.getElementById('fCancel').onclick=()=>dlg.close();
document.getElementById('fm').addEventListener('submit',ev=>{
  ev.preventDefault();
  const v={title:document.getElementById('fT').value.trim(), date:document.getElementById('fD').value, cat:fC.value, yearly:document.getElementById('fY').checked, memo:document.getElementById('fM').value.trim()};
  if(!v.title||!v.date) return;
  if (['bday','memorial','anniv'].includes(v.cat)) v.yearly=true;
  if(editing) Object.assign(editing,v); else events.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...v});
  save(); const [y,m,d]=v.date.split('-').map(Number); Y=y; M=m; D=d; dlg.close(); render();
});
fDel.onclick=()=>{
  if(!editing) return;
  if(fDel.dataset.armed!=='1'){ fDel.dataset.armed='1'; fDel.textContent='もう一度押すと消えます'; return; }
  events=events.filter(e=>e!==editing); save(); dlg.close(); render();
};

/* ---------- 控え ---------- */
const menu=document.getElementById('menu');
document.getElementById('menuB').onclick=()=>{ document.getElementById('note').hidden=true; menu.showModal(); };
document.getElementById('mClose').onclick=()=>menu.close();
const bdIn=document.getElementById('bd'); bdIn.value=settings.birthday||'';
bdIn.onchange=()=>{ settings.birthday=bdIn.value||''; saveSettings(); render(); };
document.getElementById('exp').onclick=async()=>{
  const txt=JSON.stringify(events), box=document.getElementById('bk'); box.value=txt;
  try{ await navigator.clipboard.writeText(txt); note('控えをコピーしました。メモ帳などに貼って残してください。'); }
  catch(e){ box.select(); note('上の欄の文字をすべて選んでコピーし、メモ帳などに残してください。'); }
};
document.getElementById('rst').onclick=()=>{
  const b=document.getElementById('rst');
  if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='もう一度押すと今の予定と置きかわります'; return; }
  b.dataset.armed=''; b.textContent='控えから戻す';
  try{
    const data=JSON.parse(document.getElementById('bk').value); if(!Array.isArray(data)) throw 0;
    events=data.filter(e=>e&&e.title&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e=>({id:e.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5), title:String(e.title).slice(0,40), date:e.date, cat:CATS[e.cat]?e.cat:'other', yearly:!!e.yearly, memo:String(e.memo||'').slice(0,200)}));
    save(); menu.close(); render();
  }catch(e){ note('控えの文字を読めませんでした。コピーした文字をそのまま貼ってください。'); }
};

addEventListener('resize',drawSpiral);
aimYaw(); yaw=yawTarget;
document.fonts.ready.then(drawSpiral);
render();
</script>

</body>
</html>
